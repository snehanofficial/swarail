<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SwaRail Fare Top-up Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    header {
      background-color: #111820;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 3px solid #00f5ff55;
    }

    header img {
      height: 50px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      color: #00f5ff;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #1c2b3a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.1);
    }

    label {
      display: block;
      margin-top: 20px;
      font-size: 1em;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
      font-size: 1em;
      background-color: #243544;
      color: #fff;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: #00f5ff;
      border: none;
      color: #000;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #00dbe4;
    }

    .result {
      margin-top: 30px;
      font-size: 1em;
      line-height: 1.6;
      background: #15232f;
      padding: 20px;
      border-radius: 8px;
    }

    .disclaimer, footer {
      text-align: center;
      font-size: 0.8em;
      margin-top: 40px;
      color: #aaa;
      padding: 10px;
    }

    footer a {
      color: #00f5ff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <img src="./logo.png" alt="SwaRail Logo" />
    <h1>SwaRail Fare Top-up Calculator</h1>
  </header>

  <div class="container">
    <label for="fare">Fare Price (₹)</label>
    <input type="number" id="fare" placeholder="e.g., 75" />

    <label for="passengers">Number of Passengers</label>
    <input type="number" id="passengers" value="1" min="1" />

    <label for="balance">R-Wallet Balance (₹)</label>
    <input type="number" id="balance" placeholder="e.g., 50" />

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="output" style="display: none;"></div>
  </div>

  <div class="disclaimer">
    <p><strong>Disclaimer:</strong> This is an unofficial utility for educational and informational use only.</p>
    <p>It is not affiliated with IRCTC, Indian Railways, or SwaRail. Please refer to official portals for accurate transactions.</p>
  </div>

  <footer>
    Made in India with ❤️ by <a href="https://github.com/snehanofficial" target="_blank">Snehan</a>
  </footer>

  <script>
    function calculate() {
      const fare = parseFloat(document.getElementById("fare").value) || 0;
      const passengers = parseInt(document.getElementById("passengers").value) || 1;
      const balance = parseFloat(document.getElementById("balance").value) || 0;

      const baseFare = fare * passengers;
      const finalPrice = parseFloat((baseFare + 17.7).toFixed(2));
      const amountRequired = Math.max(finalPrice - balance, 0);
      const topUp = amountRequired === 0 ? 0 : Math.ceil(amountRequired / 100) * 100;

      document.getElementById("output").style.display = "block";
      document.getElementById("output").innerHTML = `
        <strong>Total Fare:</strong> ₹${baseFare.toFixed(2)}<br><br>
        <strong>+ Service Fee:</strong> ₹17.70<br><br>
        <strong>Final Payable:</strong> ₹${finalPrice}<br><br>
        <strong>Wallet Balance:</strong> ₹${balance.toFixed(2)}<br><br>
        <strong>Amount Required:</strong> ₹${amountRequired.toFixed(2)}<br><br>
        <strong>Suggested Top-up (nearest ₹100):</strong> ₹${topUp}
      `;
    }
  </script>

</body>
</html>
